function useLocalStorage(key, initial) {
  const [v, setV] = useState(() => {
    try { const raw = localStorage.getItem(key); if (raw!==null) return JSON.parse(raw); } catch(e){}
    return initial;
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} }, [key, v]);
  return [v, setV];
}

/* ============================== WEATHER (Open-Meteo, no key) ============================== */
function useWeather() {
  const [w, setW] = useState({ loading:true, temp:null, code:null, label:'…', city:'Maison' });
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        // Try geolocation, fallback to Paris
        const getCoords = () => new Promise((res) => {
          if (!navigator.geolocation) return res({ lat:48.8566, lon:2.3522, city:'Paris' });
          navigator.geolocation.getCurrentPosition(
            (p) => res({ lat:p.coords.latitude, lon:p.coords.longitude, city:'Ici' }),
            () => res({ lat:48.8566, lon:2.3522, city:'Paris' }),
            { timeout:3000 }
          );
        });
        const { lat, lon, city } = await getCoords();
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`);
        const j = await r.json();
        if (!alive) return;
        const code = j?.current?.weather_code ?? 0;
        const temp = Math.round(j?.current?.temperature_2m ?? 0);
        setW({ loading:false, temp, code, label: weatherLabel(code), city });
      } catch(e) {
        if (alive) setW({ loading:false, temp:null, code:null, label:'Ambiance maison', city:'Maison' });
      }
    })();
    return () => { alive = false; };
  }, []);
  return w;
}
function weatherLabel(c) {
  if (c===0) return 'Ciel dégagé';
  if ([1,2].includes(c)) return 'Éclaircies';
  if (c===3) return 'Nuageux';
  if ([45,48].includes(c)) return 'Brumeux';
  if ([51,53,55,56,57].includes(c)) return 'Bruine';
  if ([61,63,65,80,81,82].includes(c)) return 'Pluvieux';
  if ([71,73,75,77,85,86].includes(c)) return 'Neige';
  if ([95,96,99].includes(c)) return 'Orageux';
  return 'Doux';
}
function weatherEmoji(c, hour){
  if (c==null) return '🌤️';
  const night = hour<6 || hour>=20;
  if (c===0) return night ? '🌙' : '☀️';
  if ([1,2].includes(c)) return night ? '⛅' : '🌤️';
  if (c===3) return '☁️';
  if ([45,48].includes(c)) return '🌫️';
  if ([51,53,55,56,57,61,63,65,80,81,82].includes(c)) return '🌧️';
  if ([71,73,75,77,85,86].includes(c)) return '❄️';
  if ([95,96,99].includes(c)) return '⛈️';
  return '🌤️';
}

/* ============================== QG : COMPASS COUNTDOWN ============================== */
function Countdown({ target }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(t); }, []);
  const diff = Math.max(0, new Date(target.date).getTime() - now);
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  const cells = [{l:'jours',v:d},{l:'heures',v:h},{l:'minutes',v:m},{l:'secondes',v:s}];
  return (
    <div className="grid grid-cols-4 gap-2 sm:gap-3">
      {cells.map((c,i)=>(
        <div key={i} className="rounded-2xl bg-white/80 border border-stone-200/70 px-2 py-3 text-center">
          <div className="title-serif text-2xl sm:text-3xl font-bold text-royal-600 tabular-nums">{String(c.v).padStart(2,'0')}</div>
          <div className="text-[10px] sm:text-xs font-mono-tab text-slate2-700/70 uppercase">{c.l}</div>
        </div>
      ))}
    </div>
  );
}

function MoodBoard({ user }) {

  const post = () => {
    if (!msg.trim()) return;
    const newM = { id:uid(), memberId:user.id, memberName:user.name, emoji, label, message:msg.trim(), createdAt:Date.now(), hugs:0 };

function FamilyCalendar() {
  const [events, setEvents] = useLocalStorage(SK.events, SEED_EVENTS);
  const [n, setN] = useState({ title:'', date:'', emoji:'🎉', type:'gathering' });
  const sorted = [...events].sort((a,b) => {
    const aa = new Date(a.date), bb = new Date(b.date);
    return aa.getMonth()===bb.getMonth() ? aa.getDate()-bb.getDate() : aa.getMonth()-bb.getMonth();
  });
  const today = new Date();
  const nextUp = sorted.find(e => {
    const d = new Date(e.date); d.setFullYear(today.getFullYear());
    return d >= today;
  });
  const add = () => {
    if (!n.title.trim() || !n.date) return;
    setEvents([{ id:uid(), title:n.title.trim(), date:n.date, emoji:n.emoji, type:n.type }, ...events]);
    setN({ title:'', date:'', emoji:'🎉', type:'gathering' });
  };
  const remove = (id) => setEvents(events.filter(e=>e.id!==id));
  return (
    <div className="card-soft rounded-3xl p-5 sm:p-6 bg-white/70 backdrop-blur-md border border-stone-200/60 shadow-soft">
      <div className="flex items-center justify-between gap-3 mb-1">

        </div>
        {nextUp && <span className="chip bg-royal-50 border-royal-100 text-royal-700">⏭ Prochain · {nextUp.emoji} {nextUp.title}</span>}
      </div>

      <div className="mt-4 grid sm:grid-cols-2 gap-2">
        {sorted.map(e => (
          <div key={e.id} className="group rounded-2xl bg-white border border-stone-200/70 p-3 flex items-center gap-3">
            <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-cream-100 to-sand-100 flex items-center justify-center text-xl">{e.emoji}</div>
            <div className="flex-1 min-w-0">
              <div className="font-medium text-slate2-900 truncate">{e.title}</div>
              <div className="text-[11px] font-mono-tab text-slate2-700/70 flex items-center gap-1.5">
                <I.cake /> {fmtDate(e.date)} · <span className="capitalize">{e.type==='birthday'?'anniversaire':e.type==='gathering'?'rassemblement':'événement'}</span>
              </div>
            </div>
            <button onClick={()=>remove(e.id)} className="p-2 rounded-xl text-slate2-700/40 hover:text-red-500 hover:bg-red-50 opacity-0 group-hover:opacity-100"><I.trash /></button>
          </div>
        ))}
      </div>

      <div className="mt-4 rounded-2xl bg-cream-50 border border-stone-200/70 p-3 grid sm:grid-cols-[1fr_auto_auto_auto_auto] gap-2">
        <input value={n.title} onChange={(e)=>setN({...n,title:e.target.value})} placeholder="Nouvel événement…" className="px-3 py-2.5 rounded-2xl bg-white border border-stone-200 text-sm min-h-[44px]" />
        <input type="date" value={n.date} onChange={(e)=>setN({...n,date:e.target.value})} className="px-3 py-2.5 rounded-2xl bg-white border border-stone-200 text-sm min-h-[44px]" />
        <input value={n.emoji} onChange={(e)=>setN({...n,emoji:e.target.value})} maxLength={2} className="w-14 text-center px-2 py-2.5 rounded-2xl bg-white border border-stone-200 text-lg min-h-[44px]" />

function Quiz({ user }) {
  const [idx, setIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [picked, setPicked] = useState(null);
  const [best, setBest] = useLocalStorage(SK.quizBest, {});
  const done = idx >= QUIZ.length;

  const choose = (i) => {
    if (picked!==null) return;
    setPicked(i);
    if (i === QUIZ[idx].correct) setScore(s => s+1);
    setTimeout(() => { setPicked(null); setIdx(x => x+1); }, 1100);
  };
  const reset = () => { setIdx(0); setScore(0); setPicked(null); };

  useEffect(() => {
    if (done) {
      const prev = best[user.id] ?? 0;
      if (score > prev) setBest({ ...best, [user.id]: score });
    }
  }, [done]);

  const congrats = () => {
    const pct = (score/QUIZ.length)*100;
    if (pct===100) return `${user.emoji} Sans-faute, ${user.name} ! Tu connais cette maison par cœur.`;
    if (pct>=70)   return `${user.emoji} Bravo ${user.name}, tu as l'oreille fine de la famille.`;
    if (pct>=40)   return `${user.emoji} Pas mal, ${user.name}, encore quelques anecdotes à creuser.`;
    return `${user.emoji} Doucement, ${user.name}, retourne discuter au salon ☕`;
  };

  return (
    <M.div initial={{opacity:0,y:8}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-8}}
      className="card-soft rounded-3xl p-5 sm:p-7 bg-white/70 border border-stone-200/60 shadow-soft">
      <div className="flex items-center justify-between gap-3 mb-3">
        <div>
          <div className="text-xs font-mono-tab text-slate2-700/70 uppercase tracking-widest">Trivia de Famille</div>
          <div className="title-serif text-2xl sm:text-3xl font-bold mt-1">Anecdotes maison</div>
        </div>
        <div className="text-right">
          <div className="text-[11px] font-mono-tab text-slate2-700/60">meilleur score</div>
          <div className="title-serif text-2xl font-bold">{best[user.id] ?? 0}<span className="text-slate2-700/50">/{QUIZ.length}</span></div>
        </div>
      </div>

      {!done ? (
        <>
          <div className="h-1.5 rounded-full bg-stone-200 overflow-hidden mb-4">
            <M.div className="h-full bg-royal-500" initial={false} animate={{ width: `${(idx/QUIZ.length)*100}%` }} transition={{ type:'spring', stiffness:120, damping:20 }} />
          </div>
          <div className="text-[11px] font-mono-tab text-slate2-700/60 mb-2">QUESTION {idx+1} / {QUIZ.length}</div>
          <M.h3 key={idx} initial={{opacity:0,y:8}} animate={{opacity:1,y:0}} className="title-serif text-xl sm:text-2xl font-bold text-slate2-900 mb-4">{QUIZ[idx].q}</M.h3>
          <div className="grid sm:grid-cols-2 gap-2">
            {QUIZ[idx].options.map((opt, i) => {
              const correct = i === QUIZ[idx].correct;
              const isPicked = picked === i;
              const reveal = picked !== null;
              const cls = reveal
                ? (correct ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : (isPicked ? 'bg-red-50 border-red-300 text-red-700' : 'bg-white border-stone-200 opacity-60'))
                : 'bg-white border-stone-200 hover:border-royal-400 hover:bg-royal-50';
              return (
                <M.button key={i} whileHover={{ y:reveal?0:-2 }} whileTap={{ scale:0.98 }} disabled={reveal} onClick={()=>choose(i)}
                  className={`text-left px-4 py-3 rounded-2xl border transition min-h-[52px] ${cls}`}>
                  <div className="text-sm font-medium">{opt}</div>
                </M.button>
              );
            })}
          </div>
          <AP>
            {picked!==null && (
              <M.div initial={{opacity:0,y:6}} animate={{opacity:1,y:0}} exit={{opacity:0}} className="mt-3 text-xs font-mono-tab text-slate2-700/80 italic">{QUIZ[idx].fun}</M.div>
            )}
          </AP>
        </>
      ) : (
        <M.div initial={{opacity:0,scale:0.96}} animate={{opacity:1,scale:1}} className="text-center py-6">
          <div className="text-6xl mb-3">{score===QUIZ.length?'🏆':score>=4?'🎉':'☕'}</div>
          <div className="title-serif text-3xl sm:text-4xl font-bold text-slate2-900">{score}<span className="text-slate2-700/50">/{QUIZ.length}</span></div>
          <p className="text-slate2-700 mt-3 max-w-md mx-auto">{congrats()}</p>
          <button onClick={reset} className="mt-5 inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-royal-500 text-white hover:bg-royal-600 min-h-[44px]"><I.sparkle /> Rejouer</button>
        </M.div>
      )}
    </M.div>
  );
}

function Photos({ user }) {
  const [photos, setPhotos] = useLocalStorage(SK.photos, SEED_PHOTOS);
  const [open, setOpen] = useState(false);
  const [n, setN] = useState({ url:'', caption:'' });
  const [beat, setBeat] = useState({});
  const like = (id) => {
    setPhotos(photos.map(p => p.id===id ? { ...p, likes: p.likes+1 } : p));
    setBeat({ ...beat, [id]: Date.now() });
    setTimeout(() => setBeat(prev => { const c = {...prev}; delete c[id]; return c; }), 700);
  };
  const submit = () => {
    if (!n.url.trim() || !n.caption.trim()) return;
    setPhotos([{ id:uid(), url:n.url.trim(), caption:n.caption.trim(), authorName:user.name, authorEmoji:user.emoji, likes:0, createdAt:Date.now() }, ...photos]);
    setN({ url:'', caption:'' }); setOpen(false);
  };
  const remove = (id) => setPhotos(photos.filter(p=>p.id!==id));

  return (
    <M.div initial={{opacity:0,y:8}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-8}}
      className="card-soft rounded-3xl p-5 sm:p-6 bg-white/70 border border-stone-200/60 shadow-soft">
      <div className="flex items-center justify-between gap-3">
        <div>
          <div className="text-xs font-mono-tab text-slate2-700/70 uppercase tracking-widest">Défi Photo du Moment</div>
          <div className="title-serif text-2xl sm:text-3xl font-bold mt-1">Galerie des grimaces</div>
        </div>
        <button onClick={()=>setOpen(o=>!o)} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-royal-500 text-white hover:bg-royal-600 min-h-[44px]"><I.camera /> Soumettre</button>
      </div>

      <AP>
        {open && (
          <M.div initial={{opacity:0,height:0}} animate={{opacity:1,height:'auto'}} exit={{opacity:0,height:0}} className="mt-3 rounded-2xl bg-cream-50 border border-stone-200/70 p-4 space-y-2 overflow-hidden">
            <input value={n.url} onChange={(e)=>setN({...n,url:e.target.value})} placeholder="URL de la photo (ex: unsplash.com/...)" className="w-full px-4 py-3 rounded-2xl bg-white border border-stone-200 font-mono-tab text-sm min-h-[44px]" />
            <input value={n.caption} onChange={(e)=>setN({...n,caption:e.target.value})} placeholder="La légende qui tue" className="w-full px-4 py-3 rounded-2xl bg-white border border-stone-200 min-h-[44px]" />
            <div className="flex gap-2"><button onClick={submit} className="inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-royal-500 text-white hover:bg-royal-600 min-h-[44px]"><I.check /> Publier</button><button onClick={()=>setOpen(false)} className="inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-white border border-stone-200 min-h-[44px]">Annuler</button></div>
          </M.div>
        )}
      </AP>

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-5">
        <AP initial={false}>
          {photos.map(p => (
            <M.div key={p.id} layout initial={{opacity:0,scale:0.95}} animate={{opacity:1,scale:1}} exit={{opacity:0,scale:0.9}}
              className="group relative rounded-3xl overflow-hidden bg-white border border-stone-200/70 shadow-soft">
              <div className="relative h-52 overflow-hidden">
                <img src={p.url} alt="" className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent" />
                <div className="absolute bottom-0 left-0 right-0 p-3 text-white">
                  <div className="text-[11px] font-mono-tab opacity-80">{p.authorEmoji} {p.authorName}</div>
                  <div className="text-sm font-medium leading-tight mt-0.5 line-clamp-2">{p.caption}</div>
                </div>
              </div>
              <div className="flex items-center justify-between p-3">
                <button onClick={()=>like(p.id)} className="inline-flex items-center gap-2 px-3 py-2 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 min-h-[40px]">
                  <span className={beat[p.id]?'heart-beat inline-block':''}>❤️</span>
                  <span className="font-mono-tab tabular-nums text-sm">{p.likes}</span>
                </button>
                <button onClick={()=>remove(p.id)} className="p-2 rounded-xl text-slate2-700/40 hover:text-red-500 hover:bg-red-50 opacity-0 group-hover:opacity-100"><I.trash /></button>
              </div>
            </M.div>
          ))}
        </AP>
      </div>
      {photos.length===0 && <div className="text-center text-slate2-700/60 italic py-8">Pas encore de grimace immortalisée…</div>}
    </M.div>
  );
}

function Playlist({ user }) {
  const [songs, setSongs] = useLocalStorage(SK.songs, SEED_SONGS);
  const [open, setOpen] = useState(false);
  const [n, setN] = useState({ title:'', artist:'', link:'', reason:'' });
  const sorted = [...songs].sort((a,b) => b.votes - a.votes);
  const vote = (id) => {
    setSongs(songs.map(s => {
      if (s.id !== id) return s;
      const voted = s.voters.includes(user.id);
      return { ...s, votes: voted ? s.votes-1 : s.votes+1, voters: voted ? s.voters.filter(x=>x!==user.id) : [...s.voters, user.id] };
    }));
  };
  const submit = () => {
    if (!n.title.trim() || !n.artist.trim()) return;
    setSongs([{ id:uid(), title:n.title.trim(), artist:n.artist.trim(), link:n.link.trim(), reason:n.reason.trim(), suggestedBy:user.name, suggestedByEmoji:user.emoji, votes:1, voters:[user.id], createdAt:Date.now() }, ...songs]);
    setN({ title:'', artist:'', link:'', reason:'' }); setOpen(false);
  };
  const remove = (id) => setSongs(songs.filter(s=>s.id!==id));

  return (
    <M.div initial={{opacity:0,y:8}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-8}}
      className="card-soft rounded-3xl p-5 sm:p-6 bg-white/70 border border-stone-200/60 shadow-soft">
      <div className="flex items-center justify-between gap-3">
        <div>
          <div className="text-xs font-mono-tab text-slate2-700/70 uppercase tracking-widest">Boîte à Musique du Salon</div>
          <div className="title-serif text-2xl sm:text-3xl font-bold mt-1">Playlist complice</div>
        </div>
        <button onClick={()=>setOpen(o=>!o)} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-royal-500 text-white hover:bg-royal-600 min-h-[44px]"><I.music /> Proposer</button>
      </div>

      <AP>
        {open && (
          <M.div initial={{opacity:0,height:0}} animate={{opacity:1,height:'auto'}} exit={{opacity:0,height:0}} className="mt-3 rounded-2xl bg-cream-50 border border-stone-200/70 p-4 space-y-2 overflow-hidden">
            <div className="grid sm:grid-cols-2 gap-2">
              <input value={n.title} onChange={(e)=>setN({...n,title:e.target.value})} placeholder="Titre" className="px-4 py-3 rounded-2xl bg-white border border-stone-200 min-h-[44px]" />
              <input value={n.artist} onChange={(e)=>setN({...n,artist:e.target.value})} placeholder="Artiste" className="px-4 py-3 rounded-2xl bg-white border border-stone-200 min-h-[44px]" />
            </div>
            <input value={n.link} onChange={(e)=>setN({...n,link:e.target.value})} placeholder="Lien streaming (optionnel)" className="w-full px-4 py-3 rounded-2xl bg-white border border-stone-200 font-mono-tab text-sm min-h-[44px]" />
            <input value={n.reason} onChange={(e)=>setN({...n,reason:e.target.value})} placeholder="Raison / souvenir lié au morceau" className="w-full px-4 py-3 rounded-2xl bg-white border border-stone-200 min-h-[44px]" />
            <div className="flex gap-2"><button onClick={submit} className="inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-royal-500 text-white hover:bg-royal-600 min-h-[44px]"><I.check /> Ajouter</button><button onClick={()=>setOpen(false)} className="inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-white border border-stone-200 min-h-[44px]">Annuler</button></div>
          </M.div>
        )}
      </AP>

      <div className="mt-5 space-y-2">
        <AP initial={false}>
          {sorted.map((s, i) => {
            const voted = s.voters.includes(user.id);
            return (
              <M.div key={s.id} layout initial={{opacity:0,y:6}} animate={{opacity:1,y:0}} exit={{opacity:0,x:-20}}
                className="group flex items-center gap-3 rounded-2xl bg-white border border-stone-200/70 p-3 sm:p-4">
                <div className="title-serif text-2xl sm:text-3xl font-bold text-slate2-700/30 w-8 text-center tabular-nums">{i+1}</div>
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-200 to-violet-100 flex items-center justify-center text-xl shadow-soft">🎵</div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-baseline gap-2 flex-wrap">
                    {s.link ? (
                      <a href={s.link} target="_blank" rel="noreferrer" className="font-semibold text-slate2-900 hover:text-royal-600 truncate">{s.title}</a>
                    ) : (
                      <div className="font-semibold text-slate2-900 truncate">{s.title}</div>
                    )}
                    <div className="text-xs text-slate2-700/70">· {s.artist}</div>
                  </div>
                  {s.reason && <div className="text-xs text-slate2-700 mt-1 italic line-clamp-2">« {s.reason} »</div>}
                  <div className="text-[11px] font-mono-tab text-slate2-700/60 mt-1">{s.suggestedByEmoji} {s.suggestedBy}</div>
                </div>
                <div className="flex items-center gap-1">
                  <button onClick={()=>vote(s.id)} className={`inline-flex items-center gap-1 px-3 py-2 rounded-2xl border min-h-[40px] transition ${voted?'bg-royal-500 text-white border-royal-500':'bg-white text-slate2-800 border-stone-200 hover:border-royal-400'}`}>
                    <I.arrowUp /> <span className="font-mono-tab tabular-nums text-sm">{s.votes}</span>
                  </button>
                  {s.voters.includes(user.id) && (
                    <button onClick={()=>remove(s.id)} className="p-2 rounded-xl text-slate2-700/40 hover:text-red-500 hover:bg-red-50 opacity-0 group-hover:opacity-100"><I.trash /></button>
                  )}
                </div>
              </M.div>
            );
          })}
        </AP>
      </div>
      {sorted.length===0 && <div className="text-center text-slate2-700/60 italic py-8">Le tourne-disque attend ta première suggestion…</div>}
    </M.div>
  );
}

/* ============================== APP ROOT ============================== */
function App() {
  const [user, setUser] = useLocalStorage(SK.currentUser, null);
  const [customMembers] = useLocalStorage(SK.customMembers, []);
  const allMembers = useMemo(() => [...PRESET_MEMBERS, ...customMembers], [customMembers]);
  const [tab, setTab] = useState('qg');

  const handleAuth = (member) => {
    setUser({ id: member.id, name: member.name, emoji: member.emoji, role: member.role, isCustom: !!member.isCustom });
  };
  const handleChange = () => setUser(null);

  // smooth scroll to top on tab change
  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [tab]);

  return (
    <div className="min-h-full pb-24 md:pb-10">
      <AP>
        {!user && <AuthGate key="auth" onAuth={handleAuth} />}
      </AP>

      {user && (
        <>
          <Header user={user} onChange={handleChange} tab={tab} setTab={setTab} />
          <main className="max-w-6xl mx-auto px-4 sm:px-6 py-5 sm:py-8">
            <AP mode="wait">
              {tab==='qg'    && <TabQG    key="qg"    user={user} allMembers={allMembers} />}
              {tab==='salon' && <TabSalon key="salon" user={user} />}
              {tab==='jeu'   && <TabJeu   key="jeu"   user={user} />}
            </AP>
            <footer className="mt-10 text-center text-[11px] font-mono-tab text-slate2-700/50">
              maison-secrete · données dans ce navigateur · made with ❤️ pour la famille SHOLA STRANGER
            </footer>
          </main>
          <BottomNav tab={tab} setTab={setTab} />
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
